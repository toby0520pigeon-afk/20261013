<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>國中數學隨機測驗網站 - 昭源宋體</title>
  
  <!-- Google Fonts: Chiron Sung HK (昭源宋體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- p5.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>

  <style>
    body {
      font-family: 'Chiron Sung HK', serif, system-ui, -apple-system;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      width: 100%;
      max-width: 820px;
      aspect-ratio: 4 / 3;
    }
    #canvas-container canvas {
      display: block;
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.2);
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6">

  <!-- 標頭 -->
  <header class="text-center mt-2 mb-2 sm:mb-4">
    <h1 class="text-2xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-indigo-200 to-cyan-300 tracking-wider">
      🧠 國中數學隨機測驗網站
    </h1>
    <p class="text-indigo-200/80 text-xs sm:text-sm mt-1 tracking-wide">
      題庫檔載入 • 每次隨機 5 題 • Google Fonts 昭源宋體
    </p>
  </header>

  <!-- p5.js Canvas 畫布容器 -->
  <main id="canvas-container" class="relative flex justify-center items-center w-full">
  </main>

  <!-- 頁尾 -->
  <footer class="mb-2 mt-4 text-slate-400 text-xs sm:text-sm text-center">
    Powered by p5.js & Chiron Sung HK (昭源宋體)
  </footer>

  <!-- 外部載入 sketch.js 邏輯檔 -->
  <script src="sketch.js"></script>
</body>
</html>
